name: Daily AI Riddle Video

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install -r requirements.txt

      - name: Generate AI Riddle Video
        run: |
          python main.py

      - name: Save MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Riddle-Video
          path: output/
          retention-days: 7
